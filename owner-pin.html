<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner PIN | NaziCredit</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf2f7;color:#1f2933;font-family:Inter,system-ui,sans-serif;padding:20px}
      main{background:#fff;border:1px solid #d9e2ec;border-radius:14px;box-shadow:0 20px 60px #0f172a22;max-width:420px;padding:28px;width:100%}
      h1{margin:0 0 8px}.eyebrow{color:#0f766e;font-size:.75rem;font-weight:900;text-transform:uppercase}.helper{color:#657386}
      label{display:grid;font-weight:800;gap:8px;margin-top:20px}input{border:1px solid #cbd5e1;border-radius:9px;font-size:1.5rem;letter-spacing:.3em;min-height:52px;padding:10px;text-align:center}
      button{background:#0f766e;border:0;border-radius:9px;color:#fff;font:inherit;font-weight:900;margin-top:16px;min-height:50px;width:100%}.message{color:#b91c1c;font-weight:700;min-height:1.2em}
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Owner verification</p>
      <h1>Enter owner PIN</h1>
      <p class="helper">This protected area contains private financial information.</p>
      <form id="pinForm">
        <label>Owner PIN<input id="ownerPin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="off" required autofocus /></label>
        <button type="submit">Unlock</button>
        <p class="message" id="pinMessage" role="status"></p>
      </form>
    </main>
    <script src="owner-pin.js"></script>
    <script src="session-guard.js"></script>
  </body>
</html>
